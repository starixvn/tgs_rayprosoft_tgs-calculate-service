include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ServiceImageName: pgtgs/calculate-api
  WorkerImageName: pgtgs/calculate-worker
  CommitterImageName: pgtgs/calculate-committer
  TgsServiceSettingKey: calculate-api
  TgsWorkerSettingKey: calculate-worker
  TgsCommitterSettingKey: calculate-committer
  HelmTemplateServiceFolderName: calculate-api
  HelmTemplateWorkerFolderName: calculate-worker
  HelmTemplateCommitterFolderName: calculate-committer
  BuildCacheKey: Tgs.CalculateService.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "CalculateServiceClient"
  artifacts:
    paths:
      - CalculateServiceClient/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.CalculateService" $ServiceImageName $Tag
    - push_docker "Tgs.CalculateWorker" $WorkerImageName $Tag
    - push_docker "Tgs.CalculateCommitter" $CommitterImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateServiceFolderName $ServiceImageName $Tag
    - push_k8s_template $HelmTemplateWorkerFolderName $WorkerImageName $Tag
    - push_k8s_template $HelmTemplateCommitterFolderName $CommitterImageName $Tag
    - push_k8s_template $HelmTemplateQueryFolderName $QueryImageName $Tag

deploy-service-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: service-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: worker-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace

deploy-committer-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: committer-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsCommitterSettingKey $HelmTemplateCommitterFolderName $namespace

deploy-service-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: service-staging
  stage: deploy-staging
  needs:
    - deploy-service-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: worker-staging
  stage: deploy-staging
  needs:
    - deploy-worker-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace

deploy-committer-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: committer-staging
  stage: deploy-staging
  needs:
    - deploy-committer-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsCommitterSettingKey $HelmTemplateCommitterFolderName $namespace

deploy-service-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: service-prod
  stage: deploy-prod
  needs:
    - deploy-service-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: worker-prod
  stage: deploy-prod
  needs:
    - deploy-worker-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace

deploy-committer-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: committer-prod
  stage: deploy-prod
  needs:
    - deploy-committer-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsCommitterSettingKey $HelmTemplateCommitterFolderName $namespace
